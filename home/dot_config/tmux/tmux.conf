# omachy tmux — identical locally and on remotes.
# Prefix: C-a on the Mac, C-b (tmux default) inside SSH sessions, so nested tmux just works.
# (C-Space is left to macOS for switching EN/HE.) Press the prefix twice to send it to the app.

# --- Core ---------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g prefix C-a
unbind C-b
bind C-a send-prefix
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g prefix C-b; unbind C-a; bind C-b send-prefix; set -g @host_color yellow' \
  'set -g @host_color cyan'

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on          # OSC 52: copies reach the Mac clipboard, even over SSH
set -g allow-passthrough on      # notifications / images from inside tmux
set -g detach-on-destroy off     # closing a session jumps to another one
set -g set-titles on
set -g set-titles-string "#S · #W"
setw -g mode-keys vi
set -g display-time 1500

# --- Keys ---------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r [ previous-window
bind -r ] next-window
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Seamless C-h/j/k/l between nvim splits and tmux panes (vim-tmux-navigator logic).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l           # prefix C-l = clear screen

# sesh: fuzzy session picker (projects, hosts, Coder workspaces) — prefix s
bind s if-shell "command -v sesh-pick" "display-popup -E -w 70% -h 60% sesh-pick" "choose-tree -Zs"
bind Tab if-shell "command -v sesh" "run-shell 'sesh last'" "switch-client -l"
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# --- Look (ANSI names → follows the terminal theme) ---------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=blue,bold]  #S #[fg=brightblack]│ "
set -g status-right "#{?client_prefix,#[fg=yellow,bold]● PREFIX ,}#[fg=brightblack]│ #[fg=#{@host_color}]󰒋 #h #[fg=brightblack]│ %H:%M "
setw -g window-status-format "#[fg=brightblack] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=magenta,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-separator ""
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g popup-border-lines rounded
set -g popup-border-style "fg=blue"
set -g message-style "fg=magenta,bg=default,bold"
setw -g mode-style "fg=black,bg=blue"

# --- Plugins (pinned by chezmoi externals; continuum must be last) ------------
set -g @resurrect-dir "~/.local/state/tmux/resurrect"
set -g @resurrect-strategy-nvim "session"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"
run-shell -b "[ -f ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux ] && ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux || true"
run-shell -b "[ -f ~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux ] && ~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux || true"
