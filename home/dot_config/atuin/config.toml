# Local-only history. Do NOT `atuin login` / `atuin sync`: history stays on this machine.
auto_sync = false
update_check = false
sync_address = "http://127.0.0.1:1"   # unroutable on purpose: sync can't leak even if triggered

search_mode = "fuzzy"
filter_mode = "global"
style = "compact"
inline_height = 20
show_preview = true
enter_accept = false
keymap_mode = "vim-insert"

# Never record lines that look like they carry secrets.
secrets_filter = true
history_filter = [
  '(?i)(pass(word)?|passwd|secret|token|api[_-]?key|bearer)\s*[=:]',
  '(?i)^\s*export\s+\S*(TOKEN|SECRET|KEY|PASS)\S*=',
]
